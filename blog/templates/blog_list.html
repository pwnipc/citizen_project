{% extends "base.html" %}

{% block title %} Blog List {% endblock %}

{% block content %} 

<h2>Blog List</h2>

{% for blog in blogs %}
<div>
    <h3>{{ blog.title }}</h3>
    <div>{{ blog.text }}</div>
    <div>{{ blog.published_date }}</div>
    <div>By {{blog.author }}</div>
</div>
{% endfor %}

{% endblock %}
